<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


<script>

   


var urna = {
    notas: [],

    avaliar: function(nota) {

        if (nota >= 1 && nota <= 5) {
            this.notas.push(nota);
        } else {
            console.log("Nota inválida!");
        }
    },

    contarNotas: function() {

        for (var nota = 1; nota <= 5; nota = nota + 1) {

            var quantidade = 0;

            for (var notaRegistrada of this.notas) {

                if (notaRegistrada == nota) {
                    quantidade = quantidade + 1;
                }
            }

            console.log("Nota " + nota + ": " + quantidade);
        }
    },

    media: function() {

        var soma = 0;

        for (var nota of this.notas) {
            soma = soma + nota;
        }

        return soma / this.notas.length;
    },

    positivas: function() {

        var quantidade = 0;

        for (var nota of this.notas) {

            if (nota >= 4) {
                quantidade = quantidade + 1;
            }
        }

        return (quantidade / this.notas.length) * 100;
    },

    maisEscolhida: function() {

        var maior = 0;
        var notaEscolhida = 0;

        for (var nota = 1; nota <= 5; nota = nota + 1) {

            var quantidade = 0;

            for (var notaRegistrada of this.notas) {

                if (notaRegistrada == nota) {
                    quantidade = quantidade + 1;
                }
            }

            if (quantidade > maior) {
                maior = quantidade;
                notaEscolhida = nota;
            }
        }

        return notaEscolhida;
    }
};




 </script>   
</body>
</html>
