<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


<script>



var campeonato = {
    equipes: [],
    partidas: [],

    cadastrar: function(nome) {

        this.equipes.push({
            nome: nome,
            pontos: 0,
            vitorias: 0,
            empates: 0,
            derrotas: 0,
            golsMarcados: 0,
            golsSofridos: 0
        });
    },

    resultado: function(time1, time2, gols1, gols2) {

        if (time1 == time2) {
            console.log("Uma equipe não pode jogar contra ela mesma!");
            return;
        }

        var equipe1;
        var equipe2;

        for (var equipe of this.equipes) {

            if (equipe.nome == time1) {
                equipe1 = equipe;
            }

            if (equipe.nome == time2) {
                equipe2 = equipe;
            }
        }

        if (equipe1 == undefined || equipe2 == undefined) {
            console.log("Equipe não encontrada!");
            return;
        }

        equipe1.golsMarcados =
            equipe1.golsMarcados + gols1;

        equipe1.golsSofridos =
            equipe1.golsSofridos + gols2;

        equipe2.golsMarcados =
            equipe2.golsMarcados + gols2;

        equipe2.golsSofridos =
            equipe2.golsSofridos + gols1;

        if (gols1 > gols2) {

            equipe1.pontos = equipe1.pontos + 3;
            equipe1.vitorias = equipe1.vitorias + 1;
            equipe2.derrotas = equipe2.derrotas + 1;

        } else if (gols2 > gols1) {

            equipe2.pontos = equipe2.pontos + 3;
            equipe2.vitorias = equipe2.vitorias + 1;
            equipe1.derrotas = equipe1.derrotas + 1;

        } else {

            equipe1.pontos = equipe1.pontos + 1;
            equipe2.pontos = equipe2.pontos + 1;

            equipe1.empates = equipe1.empates + 1;
            equipe2.empates = equipe2.empates + 1;
        }
    },

    saldo: function(equipe) {
        return equipe.golsMarcados - equipe.golsSofridos;
    },

    melhorAtaque: function() {

        var melhor = this.equipes[0];

        for (var equipe of this.equipes) {

            if (equipe.golsMarcados > melhor.golsMarcados) {
                melhor = equipe;
            }
        }

        return melhor;
    }
};


 </script>   
</body>
</html>
