<script>

    var maquina = {

        cafe: 0,

            this.agua = this.agua + quantidade
        },

        reporCafe: function(quantidade){
            this.cafe = this.cafe + quantidade
        },

        adicionarCopos:

        },

        prepararCafe: function(){
            if (this.agua >= 200 &&
                this.cafe >= 20 &&
                this.copos >= 1){

                    this.agua = this.agua - 200
                    this.cafe = this.cafe - 20
                    this.copos = this.copos - 1

                    this.cafesPreparados = this.cafesPreparados + 1

                    console.log("Café preparado")
                 } else {

                 }
                },
                 consultar: function(){

                    console.log("Café", this.cafe)
                    console.log("Copos", this.copos)

                      }
                  }
